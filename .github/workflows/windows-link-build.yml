name: Windows Window Link Build

on:
  push:
    branches:
      - version/v1.2.3
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Windows x64 package
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
          run_install: false

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Verify Windows desktop compilation
        run: cargo check -p xiangqi-desktop --target x86_64-pc-windows-msvc

      - name: Download Microsoft VC++ Runtime
        shell: pwsh
        run: |
          $runtime = Join-Path $env:RUNNER_TEMP "VC_redist.x64.exe"
          Invoke-WebRequest -Uri "https://aka.ms/vs/17/release/vc_redist.x64.exe" -OutFile $runtime
          "VC_REDIST_X64_PATH=$runtime" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      # The application binary and Rust compilation have already passed. Build
      # the NSIS installer explicitly so CI does not depend on WiX/light.exe.
      - name: Build Windows NSIS installer
        shell: pwsh
        run: pnpm --dir apps/desktop tauri build --target x86_64-pc-windows-msvc --bundles nsis

      - name: Verify packaged Windows runtime
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path target/x86_64-pc-windows-msvc/release/bundle/nsis -Filter *.exe -File |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $installer) { throw "Windows NSIS installer was not found." }
          ./scripts/verify-windows-runtime.ps1 -Installer $installer -RedistInstaller $env:VC_REDIST_X64_PATH

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: Xiangqi-Studio-Windows-x64
          if-no-files-found: error
          path: |
            target/x86_64-pc-windows-msvc/release/bundle/**
            apps/desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/**
