name: Qixi support pages

on:
  push:
    branches:
      - main
    paths:
      - docs/qixi-site/**
      - .github/workflows/qixi-pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qixi-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/qixi-site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
