name: Qixi iOS TestFlight

on:
  workflow_dispatch:
    inputs:
      marketing_version:
        description: "App Store marketing version"
        required: true
        default: "1.0.0"
      build_number:
        description: "App Store Connect build number"
        required: true
        default: "10008"

concurrency:
  group: qixi-ios-testflight-${{ github.event.inputs.marketing_version }}-${{ github.event.inputs.build_number }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  upload:
    name: Build and upload Qixi to TestFlight
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check Xcode and iOS SDK
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep -E 'iOS [0-9]+'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Rust for WebAssembly
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: latest

      - name: Require checked-in iOS project
        run: |
          test -f apps/endgame-training/ios/App/App.xcodeproj/project.pbxproj || {
            echo "apps/endgame-training/ios is missing. Commit the Capacitor iOS project before running this workflow." >&2
            exit 1
          }

      - name: Build web assets and sync iOS
        run: |
          pnpm --dir apps/endgame-training mobile:build
          pnpm --dir apps/endgame-training exec cap sync ios

      - name: Apply App Store version
        env:
          MARKETING_VERSION: ${{ github.event.inputs.marketing_version }}
          BUILD_NUMBER: ${{ github.event.inputs.build_number }}
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          pbx = Path('apps/endgame-training/ios/App/App.xcodeproj/project.pbxproj')
          text = pbx.read_text()
          text = re.sub(r'MARKETING_VERSION = [0-9]+(?:\.[0-9]+)*;', f"MARKETING_VERSION = {os.environ['MARKETING_VERSION']};", text)
          text = re.sub(r'CURRENT_PROJECT_VERSION = [0-9]+;', f"CURRENT_PROJECT_VERSION = {os.environ['BUILD_NUMBER']};", text)
          pbx.write_text(text)
          PY

          grep -n "MARKETING_VERSION\|CURRENT_PROJECT_VERSION" apps/endgame-training/ios/App/App.xcodeproj/project.pbxproj

      - name: Write App Store Connect API key
        env:
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: |
          test -n "$APP_STORE_CONNECT_API_KEY_BASE64" || {
            echo "Missing secret APP_STORE_CONNECT_API_KEY_BASE64" >&2
            exit 1
          }
          mkdir -p "$RUNNER_TEMP/appstoreconnect"
          printf '%s' "$APP_STORE_CONNECT_API_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/appstoreconnect/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/appstoreconnect/AuthKey.p8"

      - name: Archive
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
        run: |
          test -n "$APP_STORE_CONNECT_API_KEY_ID" || { echo "Missing secret APP_STORE_CONNECT_API_KEY_ID" >&2; exit 1; }
          test -n "$APP_STORE_CONNECT_API_ISSUER_ID" || { echo "Missing secret APP_STORE_CONNECT_API_ISSUER_ID" >&2; exit 1; }

          xcodebuild \
            -project apps/endgame-training/ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Qixi.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/appstoreconnect/AuthKey.p8" \
            -authenticationKeyID "$APP_STORE_CONNECT_API_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_API_ISSUER_ID" \
            archive

      - name: Upload to App Store Connect / TestFlight
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>destination</key>
            <string>upload</string>
            <key>teamID</key>
            <string>US68YTUSG4</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key>
            <false/>
            <key>stripSwiftSymbols</key>
            <true/>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          PLIST

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Qixi.xcarchive" \
            -exportPath "$RUNNER_TEMP/QixiExport" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/appstoreconnect/AuthKey.p8" \
            -authenticationKeyID "$APP_STORE_CONNECT_API_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_API_ISSUER_ID"
