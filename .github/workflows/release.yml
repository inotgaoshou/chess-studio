name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v1.0.0"
        required: true
        default: "v1.0.0"
      platform:
        description: "Build platform"
        required: true
        default: "all"
        type: choice
        options:
          - windows
          - macos
          - all

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  select_build_platforms:
    name: Select release platforms
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
    steps:
      - id: targets
        run: |
          if [ "${{ github.event.inputs.platform || 'all' }}" = "all" ]; then
            matrix='{"include":[{"name":"Windows x64","platform":"windows-x64","os":"windows-latest","rust_target":"x86_64-pc-windows-msvc","tauri_args":"--target x86_64-pc-windows-msvc --bundles nsis"},{"name":"macOS Apple Silicon","platform":"macos-arm64","os":"macos-latest","rust_target":"aarch64-apple-darwin","tauri_args":"--target aarch64-apple-darwin"}]}'
          elif [ "${{ github.event.inputs.platform }}" = "macos" ]; then
            matrix='{"include":[{"name":"macOS Apple Silicon","platform":"macos-arm64","os":"macos-latest","rust_target":"aarch64-apple-darwin","tauri_args":"--target aarch64-apple-darwin"}]}'
          else
            matrix='{"include":[{"name":"Windows x64","platform":"windows-x64","os":"windows-latest","rust_target":"x86_64-pc-windows-msvc","tauri_args":"--target x86_64-pc-windows-msvc --bundles nsis"}]}'
          fi
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  build:
    needs: [select_build_platforms]
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select_build_platforms.outputs.matrix) }}

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Windows 7z
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install 7zip -y --no-progress
          "C:\Program Files\7-Zip" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install macOS 7z
        if: runner.os == 'macOS'
        run: brew install p7zip

      # setup-node resolves the pnpm cache during this step, so pnpm must exist first.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target

      - name: Download Microsoft VC++ Runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $runtime = Join-Path $env:RUNNER_TEMP "VC_redist.x64.exe"
          Invoke-WebRequest -Uri "https://aka.ms/vs/17/release/vc_redist.x64.exe" -OutFile $runtime
          "VC_REDIST_X64_PATH=$runtime" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build release asset
        run: pnpm --dir apps/desktop tauri build ${{ matrix.tauri_args }}

      - name: Verify packaged Windows runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path target/x86_64-pc-windows-msvc/release/bundle/nsis -Filter *.exe -File |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $installer) { throw "Windows NSIS installer was not found." }
          ./scripts/verify-windows-runtime.ps1 -Installer $installer -RedistInstaller $env:VC_REDIST_X64_PATH

      - name: Upload verified release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          if-no-files-found: error
          path: target/${{ matrix.rust_target }}/release/bundle/**

  publish:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Download verified release assets
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: release-assets

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: Xiangqi Studio ${{ github.event.inputs.tag || github.ref_name }}
          body: |
            ## 更新说明

            - 桌面端中国象棋打谱、变例、SQLite 自动保存
            - 本地 Pikafish 引擎分析、MultiPV 候选线和私教推演
            - Windows 安装包内置 Microsoft VC++ Runtime，首次安装无需手动补装运行库

            ## 包说明

            - macOS Apple Silicon：内置 Apple Silicon Pikafish 与窗口连线识别模型
            - Windows x64：内置 Pikafish SSE4.1/POPCNT、窗口连线识别模型和 VC++ Runtime
            - 开局库和棋理资料包不随安装包分发，后续按需提供
          draft: true
          prerelease: false
          files: |
            release-assets/**/*.exe
            release-assets/**/*.dmg
            release-assets/**/*.tar.gz
            release-assets/**/*.sig
          fail_on_unmatched_files: true
