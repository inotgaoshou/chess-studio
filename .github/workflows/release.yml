name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v1.0.0"
        required: true
        default: "v1.0.0"
      platform:
        description: "Build platform"
        required: true
        default: "all"
        type: choice
        options:
          - windows
          - macos
          - all

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  select_build_platforms:
    name: Select release platforms
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
    steps:
      - id: targets
        run: |
          if [ "${{ github.event.inputs.platform || 'all' }}" = "all" ]; then
            matrix='{"include":[{"name":"Windows x64","platform":"windows-x64","os":"windows-latest","rust_target":"x86_64-pc-windows-msvc","tauri_args":"--target x86_64-pc-windows-msvc"},{"name":"macOS Apple Silicon","platform":"macos-arm64","os":"macos-latest","rust_target":"aarch64-apple-darwin","tauri_args":"--target aarch64-apple-darwin"}]}'
          elif [ "${{ github.event.inputs.platform }}" = "macos" ]; then
            matrix='{"include":[{"name":"macOS Apple Silicon","platform":"macos-arm64","os":"macos-latest","rust_target":"aarch64-apple-darwin","tauri_args":"--target aarch64-apple-darwin"}]}'
          else
            matrix='{"include":[{"name":"Windows x64","platform":"windows-x64","os":"windows-latest","rust_target":"x86_64-pc-windows-msvc","tauri_args":"--target x86_64-pc-windows-msvc"}]}'
          fi
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  build:
    needs: [select_build_platforms]
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select_build_platforms.outputs.matrix) }}

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Windows 7z
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install 7zip -y --no-progress
          "C:\Program Files\7-Zip" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install macOS 7z
        if: runner.os == 'macOS'
        run: brew install p7zip

      # setup-node resolves the pnpm cache during this step, so pnpm must exist first.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target

      - name: Build and upload release asset
        uses: tauri-apps/tauri-action@v0
        env:
          # Repository settings may restrict the default GITHUB_TOKEN to read-only.
          # RELEASE_TOKEN is an optional fine-grained PAT with Contents: Read and write.
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
        with:
          # The Tauri config and its pnpm build script live in this workspace package.
          # Without this, tauri-action runs `pnpm build` from the repository root.
          projectPath: apps/desktop
          # Resource selection lives in tauri.conf.json so PowerShell does not
          # have to parse a JSON string passed through an environment variable.
          args: ${{ matrix.tauri_args }}
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: Xiangqi Studio ${{ github.event.inputs.tag || github.ref_name }}
          releaseBody: |
            ## 更新说明

            - 桌面端中国象棋打谱、变例、SQLite 自动保存
            - 本地 Pikafish / 外部 UCI/UCCI 引擎分析、MultiPV 候选线和私教推演
            - 整局复盘报告、局势图、质量评分和 PDF 导出

            ## 包说明

            - macOS Apple Silicon：内置 Apple Silicon Pikafish 与窗口连线识别模型
            - Windows x64：内置 Pikafish SSE4.1/POPCNT 与窗口连线识别模型
            - 开局库和棋理资料包不随安装包分发，后续按需提供
            - Linux x64：本轮 GitHub Release 暂不打包，后续需要时再启用
          releaseDraft: true
          prerelease: false
