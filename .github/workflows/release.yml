name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v1.0.0"
        required: true
        default: "v1.0.0"

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  TAURI_WINDOWS_RESOURCE_CONFIG: '{"bundle":{"resources":["../../../THIRD_PARTY_NOTICES.md","resources/fonts/OFL.txt","resources/pikafish/pikafish.exe","resources/pikafish/pikafish.nnue","resources/pikafish/Copying.txt","resources/pikafish/Pikafish-README.md","resources/pikafish/RESOURCE-MANIFEST.txt","resources/link-vision","resources/master-style","resources/flyknife-library","resources/book-topics"]}}'

jobs:
  build_windows:
    name: Windows x64
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Windows 7z
        shell: pwsh
        run: |
          choco install 7zip -y --no-progress
          "C:\Program Files\7-Zip" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Setup Windows engine build toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: clang64
          install: mingw-w64-clang-x86_64-clang make git

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: Build Windows engine resources from pinned Pikafish source
        shell: msys2 {0}
        run: |
          PIKAFISH_SOURCE_REVISION=b97ef0f9eb15bd99899b272e0236bfebf86313b6
          git clone https://github.com/official-pikafish/Pikafish.git "$RUNNER_TEMP/pikafish-source"
          git -C "$RUNNER_TEMP/pikafish-source" checkout --detach "$PIKAFISH_SOURCE_REVISION"
          cp apps/desktop/src-tauri/resources/pikafish/pikafish.nnue "$RUNNER_TEMP/pikafish-source/src/pikafish.nnue"
          cd "$RUNNER_TEMP/pikafish-source/src"
          make -j4 build ARCH=x86-64-universal COMP=clang EXE=pikafish.exe
          make strip COMP=clang EXE=pikafish.exe
          cp pikafish.exe "$GITHUB_WORKSPACE/apps/desktop/src-tauri/resources/pikafish/pikafish.exe"
          rm -f "$GITHUB_WORKSPACE/apps/desktop/src-tauri/resources/pikafish/pikafish"
          cd "$GITHUB_WORKSPACE"
          ./scripts/verify-embedded-engine-resources.sh windows-x64

      - name: Smoke test Pikafish NNUE
        shell: pwsh
        run: ./scripts/verify-pikafish-windows-smoke.ps1 -ResourceDirectory apps/desktop/src-tauri/resources/pikafish

      - name: Report staged Windows resources
        shell: pwsh
        run: |
          Get-ChildItem apps/desktop/src-tauri/resources -Recurse -File |
            Sort-Object Length -Descending |
            Select-Object -First 30 FullName, Length |
            Format-Table -AutoSize

      - name: Download Microsoft VC++ Runtime
        shell: pwsh
        run: |
          $runtime = Join-Path $env:RUNNER_TEMP "VC_redist.x64.exe"
          Invoke-WebRequest -Uri "https://aka.ms/vs/17/release/vc_redist.x64.exe" -OutFile $runtime
          "VC_REDIST_X64_PATH=$runtime" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Test desktop UI
        run: pnpm --filter xiangqi-desktop-ui test

      - name: Build desktop UI
        run: pnpm --filter xiangqi-desktop-ui build

      - name: Check Windows desktop compilation
        run: cargo check -p xiangqi-desktop --target x86_64-pc-windows-msvc

      - name: Build Windows NSIS installer
        run: pnpm --dir apps/desktop tauri build --config "$env:TAURI_WINDOWS_RESOURCE_CONFIG" --target x86_64-pc-windows-msvc --bundles nsis

      - name: Verify packaged Windows installer
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path target/x86_64-pc-windows-msvc/release/bundle/nsis -Filter *.exe -File |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $installer) { throw "Windows NSIS installer was not found." }
          ./scripts/verify-windows-runtime.ps1 `
            -Installer $installer `
            -RedistInstaller $env:VC_REDIST_X64_PATH `
            -SizeReportJson windows-package-size-report.json `
            -SizeReportMarkdown windows-package-size-report.md

      - name: Upload verified Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: Xiangqi-Studio-Windows-x64
          if-no-files-found: error
          path: |
            target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            windows-package-size-report.json
            windows-package-size-report.md

  publish:
    name: Draft GitHub release
    needs: build_windows
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Download verified release assets
        uses: actions/download-artifact@v4
        with:
          name: Xiangqi-Studio-Windows-x64
          path: release-assets

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: Xiangqi Studio ${{ github.event.inputs.tag || github.ref_name }}
          draft: true
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            release-assets/**/*.exe
            release-assets/windows-package-size-report.json
            release-assets/windows-package-size-report.md
          body: |
            ## Windows x64

            - NSIS 安装包，适用于 Windows 10/11 x64
            - 内置 Pikafish 及固定版本的中国象棋 NNUE
            - 内置 Microsoft Visual C++ Runtime，干净系统无需手动安装运行库
            - 包含窗口连线识别模型

            当前安装包未进行 Authenticode 代码签名。
