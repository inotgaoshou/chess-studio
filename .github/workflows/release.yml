name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v1.0.0"
        required: true
        default: "v1.0.0"
      include_macos:
        description: "Build macOS packages and upload them to this release"
        required: false
        type: boolean
        default: false

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  PIKAFISH_VERSION: "2026-01-02"
  TAURI_RESOURCE_CONFIG: '{"bundle":{"resources":["resources/fonts/OFL.txt","resources/pikafish"]}}'

jobs:
  validate-macos-signing:
    name: Validate macOS signing
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.signing.outputs.configured }}
    steps:
      - name: Verify signing and notarization secrets
        id: signing
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=0
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!name}" ]; then
              echo "::warning title=Missing macOS release secret::${name} is required only for notarized macOS DMG builds."
              missing=1
            fi
          done
          echo "configured=$([ "$missing" -eq 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  build:
    needs: validate-macos-signing
    name: ${{ matrix.name }}
    # Tag pushes publish the two ready-to-ship platforms quickly. Run this workflow
    # manually with include_macos enabled when signed/notarized macOS packages are needed.
    if: matrix.platform == 'windows-x64' || matrix.platform == 'linux-x64' || (github.event_name == 'workflow_dispatch' && inputs.include_macos == true)
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            platform: macos-arm64
            os: macos-14
            rust_target: aarch64-apple-darwin
            tauri_args: "--target aarch64-apple-darwin"
          - name: macOS Intel
            platform: macos-x64
            os: macos-13
            rust_target: x86_64-apple-darwin
            tauri_args: "--target x86_64-apple-darwin"
          - name: Windows x64
            platform: windows-x64
            os: windows-latest
            rust_target: x86_64-pc-windows-msvc
            tauri_args: "--target x86_64-pc-windows-msvc"
          - name: Linux x64
            platform: linux-x64
            os: ubuntu-22.04
            rust_target: x86_64-unknown-linux-gnu
            tauri_args: "--target x86_64-unknown-linux-gnu"

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            p7zip-full

      - name: Install macOS 7z
        if: runner.os == 'macOS'
        run: brew install p7zip

      - name: Install Windows 7z
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install 7zip -y --no-progress
          "C:\Program Files\7-Zip" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      # setup-node resolves the pnpm cache during this step, so pnpm must exist first.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target

      - name: Import Apple Developer ID certificate
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: scripts/import-apple-certificate.sh

      - name: Verify Apple signing identity
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          security find-identity -v -p codesigning
          security find-identity -v -p codesigning | grep -F "$APPLE_SIGNING_IDENTITY"

      - name: Prepare embedded Pikafish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: scripts/prepare-pikafish-resource.sh ${{ matrix.platform }}

      - name: Build and upload release asset
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          # The Tauri config and its pnpm build script live in this workspace package.
          # Without this, tauri-action runs `pnpm build` from the repository root.
          projectPath: apps/desktop
          args: ${{ matrix.tauri_args }} --config ${{ env.TAURI_RESOURCE_CONFIG }}
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: Xiangqi Studio ${{ github.event.inputs.tag || github.ref_name }}
          releaseBody: |
            ## 更新说明

            - 桌面端中国象棋打谱、变例、SQLite 自动保存
            - 本地 Pikafish 分析、MultiPV 候选线和私教推演
            - 整局复盘报告、局势图、质量评分和 PDF 导出

            ## 包说明

            - macOS Apple Silicon：内置 Pikafish Apple Silicon
            - macOS Intel：当前官方 Pikafish 包未提供 Intel macOS 引擎，应用可安装，分析需手动配置外部引擎
            - Windows x64 / Linux x64：内置 Pikafish SSE4.1/POPCNT 通用 x64 引擎
          releaseDraft: true
          prerelease: false

      - name: Verify notarized macOS artifacts
        if: runner.os == 'macOS'
        shell: bash
        run: scripts/verify-macos-release.sh
