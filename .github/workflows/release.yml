name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v1.0.0"
        required: true
        default: "v1.0.0"

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build_windows:
    name: Windows x64
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Windows 7z
        shell: pwsh
        run: |
          choco install 7zip -y --no-progress
          "C:\Program Files\7-Zip" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      # setup-node resolves the pnpm cache during this step, so pnpm must exist first.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target

      - name: Download Microsoft VC++ Runtime
        shell: pwsh
        run: |
          $runtime = Join-Path $env:RUNNER_TEMP "VC_redist.x64.exe"
          Invoke-WebRequest -Uri "https://aka.ms/vs/17/release/vc_redist.x64.exe" -OutFile $runtime
          "VC_REDIST_X64_PATH=$runtime" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build release asset
        run: pnpm --dir apps/desktop tauri build --target x86_64-pc-windows-msvc --bundles nsis

      - name: Verify packaged Windows runtime
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path target/x86_64-pc-windows-msvc/release/bundle/nsis -Filter *.exe -File |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $installer) { throw "Windows NSIS installer was not found." }
          ./scripts/verify-windows-runtime.ps1 -Installer $installer -RedistInstaller $env:VC_REDIST_X64_PATH

      - name: Upload verified release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-windows-x64
          if-no-files-found: error
          path: target/x86_64-pc-windows-msvc/release/bundle/**

  publish:
    needs: [build_windows]
    runs-on: ubuntu-latest
    steps:
      - name: Download verified release assets
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: release-assets

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: Xiangqi Studio ${{ github.event.inputs.tag || github.ref_name }}
          body: |
            ## 更新说明

            - 桌面端中国象棋打谱、变例、SQLite 自动保存
            - 本地 Pikafish 引擎分析、MultiPV 候选线和私教推演
            - Windows 安装包内置 Microsoft VC++ Runtime，首次安装无需手动补装运行库

            ## 包说明

            - Windows x64：内置 Pikafish SSE4.1/POPCNT、窗口连线识别模型和 VC++ Runtime
            - 开局库和棋理资料包不随安装包分发，后续按需提供
          draft: true
          prerelease: false
          files: |
            release-assets/**/*.exe
          fail_on_unmatched_files: true
