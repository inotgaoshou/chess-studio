# Install as /etc/nginx/conf.d/qixiapp.conf after the five certificate folders
# described in deploy/README.md exist. The existing xiangqi-admin service stays
# on loopback; its former IP-only Nginx vhost is replaced with a redirect.

server {
    listen 80;
    server_name qixiapp.cn admin.qixiapp.cn admin-test.qixiapp.cn api.qixiapp.cn api-test.qixiapp.cn;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/nginx/acme;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 80;
    server_name www.qixiapp.cn;
    return 301 https://qixiapp.cn$request_uri;
}

# qixiapp.cn's Tencent certificate must include www.qixiapp.cn as a SAN. This
# keeps www usable over HTTPS before redirecting it to the canonical apex URL.
server {
    listen 443 ssl;
    http2 on;
    server_name www.qixiapp.cn;

    ssl_certificate     /etc/nginx/certs/qixiapp.cn/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/qixiapp.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 301 https://qixiapp.cn$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name qixiapp.cn;

    ssl_certificate     /etc/nginx/certs/qixiapp.cn/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/qixiapp.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = /health {
        default_type application/json;
        return 200 '{"status":"ok"}';
    }

    location = /privacy.html {
        return 302 https://inotgaoshou.github.io/chess-studio/privacy.html;
    }

    location / {
        return 302 https://inotgaoshou.github.io/chess-studio/;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name admin.qixiapp.cn;

    ssl_certificate     /etc/nginx/certs/admin.qixiapp.cn/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/admin.qixiapp.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    client_max_body_size 128m;

    root /opt/qixi-admin-api/production-current/apps/admin-web/dist;
    index index.html;

    location = /health {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

