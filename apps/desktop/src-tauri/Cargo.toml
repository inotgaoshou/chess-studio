[package]
name = "xiangqi-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
ab_glyph = "0.2"
base64 = "0.22"
chrono.workspace = true
engine-protocol = { path = "../../../crates/engine-protocol" }
local-store = { path = "../../../crates/local-store" }
link-core = { path = "../../../crates/link-core" }
lopdf = { version = "0.35.0", default-features = false, features = ["nom_parser"] }
manual-format = { path = "../../../crates/manual-format" }
keyring = "3"
gif = "0.13"
image = { version = "0.25", default-features = false, features = ["gif", "png"] }
imageproc = { version = "0.25", default-features = false }
ndarray = "0.17"
ort = "2.0.0-rc.13"
reqwest = { version = "0.13", features = ["json"] }
rusqlite = { version = "0.31", features = ["bundled"] }
printpdf = { version = "0.8.2", default-features = false }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
sync-protocol = { path = "../../../crates/sync-protocol" }
tauri = { version = "2", features = [] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tempfile = "3.23"
tokio.workspace = true
uuid.workspace = true
xiangqi-core = { path = "../../../crates/xiangqi-core" }
xiangqi-manual = { path = "../../../crates/manual" }

[target.'cfg(windows)'.dependencies]
# Keep window enumeration, DPI conversion and capture inside the desktop
# process.  The Windows path must not shell out to PowerShell for every frame.
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_System_Threading",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }

[[bin]]
name = "xiangqi-desktop"
path = "src/main.rs"
