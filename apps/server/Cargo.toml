[package]
name = "xiangqi-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
argon2 = "0.5"
axum.workspace = true
chrono.workspace = true
dotenvy = "0.15"
engine-protocol = { path = "../../crates/engine-protocol" }
jsonwebtoken = { version = "10.3", default-features = false, features = ["rust_crypto"] }
password-hash = { version = "0.5", features = ["getrandom"] }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "mysql", "chrono", "json"] }
sync-protocol = { path = "../../crates/sync-protocol" }
thiserror.workspace = true
tokio.workspace = true
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid.workspace = true
xiangqi-core = { path = "../../crates/xiangqi-core" }

[[bin]]
name = "xiangqi-server"
path = "src/main.rs"
