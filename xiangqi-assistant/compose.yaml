services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: xiangqi
      MYSQL_USER: xiangqi
      MYSQL_PASSWORD: xiangqi_dev
      MYSQL_ROOT_PASSWORD: local_root_only
    ports:
      - "3306:3306"
    volumes:
      - xiangqi_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uxiangqi", "-pxiangqi_dev", "--silent"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  xiangqi_mysql:
