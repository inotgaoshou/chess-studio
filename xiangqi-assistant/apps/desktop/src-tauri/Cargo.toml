[package]
name = "xiangqi-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono.workspace = true
engine-protocol = { path = "../../../crates/engine-protocol" }
local-store = { path = "../../../crates/local-store" }
manual-format = { path = "../../../crates/manual-format" }
keyring = "3"
reqwest = { version = "0.13", features = ["json"] }
printpdf = { version = "0.8.2", default-features = false }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
sync-protocol = { path = "../../../crates/sync-protocol" }
tauri = { version = "2", features = [] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tempfile = "3.23"
tokio.workspace = true
uuid.workspace = true
xiangqi-core = { path = "../../../crates/xiangqi-core" }
xiangqi-manual = { path = "../../../crates/manual" }

[[bin]]
name = "xiangqi-desktop"
path = "src/main.rs"
