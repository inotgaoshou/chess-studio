[workspace]
resolver = "2"
members = [
  "crates/xiangqi-core",
  "crates/manual",
  "crates/manual-format",
  "crates/web-core",
  "crates/engine-protocol",
  "crates/sync-protocol",
  "crates/local-store",
  "apps/server",
  "apps/desktop/src-tauri",
]

[workspace.package]
version = "1.0.1"
edition = "2024"
license = "GPL-3.0-only"

[workspace.dependencies]
anyhow = "1.0"
async-trait = "0.1"
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.48", features = ["full"] }
uuid = { version = "1.18", features = ["v4", "serde"] }
